name: Calidad del sitio en producción

on:
  workflow_run:
    workflows: ["Compilar y desplegar el sitio"]
    types: [completed]
  schedule:
    - cron: "0 11 * * 1" # lunes 7:00 AST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    # Solo tras un despliegue exitoso (o cron/manual)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Auditar la portada (umbral 100 en todo)
        run: |
          npx -y lighthouse https://multiverso.do --output json --output html \
            --output-path ./lighthouse_report --chrome-flags="--headless" \
            --only-categories=performance,accessibility,best-practices,seo
          mv lighthouse_report.report.html lighthouse_report.html
          mv lighthouse_report.report.json lighthouse_report.json
          python3 scripts/lighthouse_to_md.py lighthouse_report.json lighthouse_report.md
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("lighthouse_report.json"))
          fallas = {k: round((v["score"] or 0) * 100)
                    for k, v in d["categories"].items()
                    if (v["score"] or 0) < 1.0}
          if fallas:
              print(f"Categorías por debajo de 100: {fallas}", file=sys.stderr)
              sys.exit(1)
          print("Lighthouse: 100 en las cuatro categorías")
          EOF
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: |
            lighthouse_report.html
            lighthouse_report.md

  enlaces:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar enlaces del sitio publicado (informativo)
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          args: --verbose --no-progress https://multiverso.do
          fail: false

name: Calidad del sitio en producción

on:
  workflow_run:
    workflows: ["Compilar y desplegar el sitio"]
    types: [completed]
  schedule:
    - cron: "0 11 * * 1" # lunes 7:00 AST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    # Solo tras un despliegue exitoso (o cron/manual)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Auditar la portada (umbral 100 en todo, mejor de 3 intentos)
        run: |
          # Espera a la propagación del CDN de Pages tras el deploy.
          sleep 45
          ok=0
          for intento in 1 2 3; do
            # lighthouse@12.2.1: la versión con la que se calibró el 100×4.
            npx -y lighthouse@12.2.1 https://multiverso.do --output json --output html \
              --output-path ./lighthouse_report --chrome-flags="--headless" \
              --only-categories=performance,accessibility,best-practices,seo || true
            mv -f lighthouse_report.report.html lighthouse_report.html 2>/dev/null || true
            mv -f lighthouse_report.report.json lighthouse_report.json 2>/dev/null || true
            if python3 - <<'EOF'
          import json, sys
          try:
              d = json.load(open("lighthouse_report.json"))
          except Exception as e:
              print(f"sin reporte utilizable: {e}", file=sys.stderr)
              sys.exit(1)
          fallas = {k: round((v["score"] or 0) * 100)
                    for k, v in d["categories"].items()
                    if (v["score"] or 0) < 1.0}
          if fallas:
              print(f"Categorías por debajo de 100: {fallas}", file=sys.stderr)
              sys.exit(1)
          print("Lighthouse: 100 en las cuatro categorías")
          EOF
            then
              ok=1
              break
            fi
            echo "Intento $intento no alcanzó 100×4 (ruido del runner); reintentando…"
            sleep 30
          done
          python3 scripts/lighthouse_to_md.py lighthouse_report.json lighthouse_report.md || true
          test "$ok" = "1"
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: |
            lighthouse_report.html
            lighthouse_report.md

  enlaces:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar enlaces del sitio publicado (informativo)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress https://multiverso.do
          fail: false
